version: '3.8'

services:
  hackathon-backend:
    image: ${DOCKER_REGISTRY-}hackathon-back
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_CONTENT_DIR=.
    environment:
      - POSTGRES_HOST=${DB_HOST}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_PORT=${DB_PORT}
    depends_on:
      - postgres
    ports:
      - "8080:8000"

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: